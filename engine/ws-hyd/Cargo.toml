[package]
name = "ws-hyd"
description = "WaterStudio's hydraulic solver: the Global Gradient Algorithm of EPANET 2.3, forked from epanet-rs."
version.workspace = true
edition.workspace = true
license.workspace = true
authors = ["Abel Heinsbroek (epanet-rs)", "WaterStudio contributors"]

[lib]
# Keep the upstream crate name in code so diffs against epanet-rs stay small.
name = "epanet_rs"

[features]
ffi = []

[dependencies]
# No default features: faer's defaults pull in rand (getrandom) and a thread pool,
# neither of which builds for wasm32-unknown-unknown.
faer = { version = "0.23.2", default-features = false, features = ["std", "sparse-linalg", "linalg", "perf-warn"] }
hashbrown = { version = "0.16", features = ["serde"] }
rayon = "1.11.0"
serde = { workspace = true }
serde_json = { workspace = true }
rmp-serde = "1.3.0"
log = "0.4"
simplelog = { version = "0.12.2", features = ["paris"] }
time = { version = "0.3", features = ["macros"] }
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.18"
