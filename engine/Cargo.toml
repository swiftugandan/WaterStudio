[workspace]
resolver = "3"
members = ["ws-model", "ws-io", "ws-hyd", "ws-study", "ws-wasm", "ws-parity", "ws-cli"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/swiftugandan/WaterStudio"
rust-version = "1.95"

[workspace.dependencies]
# Forked from vitens/epanet-rs at 1a387056 (see ws-hyd/FORK.md).
epanet-rs = { path = "ws-hyd", package = "ws-hyd" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ws-study = { path = "ws-study" }
ws-model = { path = "ws-model" }
ws-io = { path = "ws-io" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
