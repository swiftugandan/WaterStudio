name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  engine:
    name: Engine (fmt, clippy, tests, wasm)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain
        run: rustup toolchain install   # reads engine/rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release --bins --examples
      - run: cargo build --release --target wasm32-unknown-unknown -p ws-wasm
      - uses: actions/upload-artifact@v7
        with:
          name: engine-builds
          path: |
            engine/target/release/ws-parity
            engine/target/release/ws
            engine/target/release/examples/mathbits
            engine/target/wasm32-unknown-unknown/release/ws_wasm.wasm
          retention-days: 7

  parity:
    name: Round trip and parity with OWA-EPANET
    needs: engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: engine-builds
          path: engine/target
      - name: Restore executable bits
        run: chmod +x engine/target/release/ws-parity engine/target/release/ws engine/target/release/examples/mathbits
      - uses: actions/cache@v6
        with:
          path: oracle/.build
          key: owa-epanet-${{ hashFiles('oracle/build.sh') }}
      - uses: actions/cache@v6
        with:
          path: oracle/.corpus
          key: corpus-${{ hashFiles('oracle/fetch-corpus.sh') }}
      - run: oracle/build.sh
      - run: oracle/fetch-corpus.sh
      - run: oracle/roundtrip.sh
      - name: Math library bits match glibc
        run: python3 -I oracle/math-bits.py engine/target/release/examples/mathbits
      - run: oracle/parity.sh --write-doc
      - name: Parity report
        if: always()
        run: cat docs/PARITY.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: parity-reports
          path: oracle/.reports
          retention-days: 30
